name: Auto Merge and Update Manifest

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  review-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Approve PR
        uses: andrewmusgrave/automatic-pull-request-review@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          event: APPROVE
          body: 'Automated review: Changes look good!'

      - name: Send "Well Done" Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Well done @${{ github.event.pull_request.user.login }}! Your PR has been reviewed and approved.'
            })

      - name: Merge PR
        uses: pascalgn/automerge-action@v0.16.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: "squash"

  update-manifest:
    needs: review-and-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Extract JSON File & Update Manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Fetch files in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Find JSON files added or modified, excluding manifest.json itself
            const jsonFiles = files.filter(f => f.filename.endsWith('.json') && f.filename !== 'tracks/manifest.json' && f.status !== 'removed');

            if (jsonFiles.length === 0) {
              console.log('No new JSON files to add to manifest.json');
              return;
            }

            // Read existing manifest or initialize array
            let manifest = [];
            if (fs.existsSync('tracks/manifest.json')) {
              try {
                manifest = JSON.parse(fs.readFileSync('tracks/manifest.json', 'utf8'));
                if (!Array.isArray(manifest)) manifest = [manifest];
              } catch (e) {
                manifest = [];
              }
            }

            // Append paths or contents of new JSON files
            for (const file of jsonFiles) {
              manifest.push({
                file: file.filename,
                added_by: context.payload.pull_request.user.login,
                sha: file.sha
              });
            }

            fs.writeFileSync('tracks/manifest.json', JSON.stringify(manifest, null, 2));

      - name: Commit and Push Manifest Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || (git commit -m "chore: update manifest.json from PR #${{ github.event.pull_request.number }}" && git push)
