name: Auto Merge and Update Manifest

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  review-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Approve PR and Send "Well Done" Comment
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Submit approval review
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: 'Automated review: Changes look good!'
            });

            // 2. Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Well done @${context.payload.pull_request.user.login}! Your PR has been reviewed and approved.`
            });

      - name: Merge PR
        uses: pascalgn/automerge-action@v0.16.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: "squash"

  update-manifest:
    needs: review-and-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Extract JSON File & Update Manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const manifestPath = path.join('tracks', 'manifest.json');

            // Fetch files changed in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Exclude manifest.json itself and non-JSON/removed files
            const jsonFiles = files.filter(f => f.filename.endsWith('.json') && f.filename !== manifestPath && f.status !== 'removed');

            if (jsonFiles.length === 0) {
              console.log('No new JSON files to add to tracks/manifest.json');
              return;
            }

            // Read existing manifest or create new array
            let manifest = [];
            if (fs.existsSync(manifestPath)) {
              try {
                manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                if (!Array.isArray(manifest)) manifest = [manifest];
              } catch (e) {
                manifest = [];
              }
            }

            // Append entries
            for (const file of jsonFiles) {
              manifest.push({
                file: file.filename,
                added_by: context.payload.pull_request.user.login,
                sha: file.sha
              });
            }

            // Ensure directory exists and write file
            fs.mkdirSync('tracks', { recursive: true });
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));

      - name: Commit and Push Manifest Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracks/manifest.json
          git diff --staged --quiet || (git commit -m "chore: update tracks/manifest.json from PR #${{ github.event.pull_request.number }}" && git push)
