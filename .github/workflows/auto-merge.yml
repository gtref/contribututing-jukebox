name: Auto Merge and Update Manifest

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    types: [closed]

jobs:
  review-comment:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Changes look good! Please click the **Merge** button to merge this PR.`
            })

  update-manifest:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Extract JSON File & Update Manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const manifestPath = path.join('tracks', 'manifest.json');

            // Fetch files changed in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Exclude manifest.json itself and non-JSON/removed files
            const jsonFiles = files.filter(f => f.filename.endsWith('.json') && f.filename !== manifestPath && f.status !== 'removed');

            if (jsonFiles.length === 0) {
              console.log('No new JSON files to add to tracks/manifest.json');
              return;
            }

            // Read existing manifest or create new array
            let manifest = [];
            if (fs.existsSync(manifestPath)) {
              try {
                manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                if (!Array.isArray(manifest)) manifest = [manifest];
              } catch (e) {
                manifest = [];
              }
            }

            // Append entries
            for (const file of jsonFiles) {
              manifest.push({
                file: file.filename,
                added_by: context.payload.pull_request.user.login,
                sha: file.sha
              });
            }

            // Ensure directory exists and write file
            fs.mkdirSync('tracks', { recursive: true });
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));

      - name: Commit and Push Manifest Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracks/manifest.json
          git diff --staged --quiet || (git commit -m "chore: update tracks/manifest.json from PR #${{ github.event.pull_request.number }}" && git push)
